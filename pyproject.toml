[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agents-monorepo"
version = "0.1.0"
description = "Monorepo workspace for financial applications and AI agents."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["applications"]
pythonpath = [
    "applications/market_research/src",
    "applications/portfolio_research/src",
    "packages/common/src",
]
